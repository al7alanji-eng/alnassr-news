name: نشر مسودة على X

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  publish:
    # يشتغل عند إضافة وسم approved، أو تعليق /publish (أو "نشر") من صاحب المستودع أو المشاركين فيه
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'approved') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (startsWith(github.event.comment.body, '/publish') || startsWith(github.event.comment.body, 'نشر')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish to X
        run: python -m bot.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: Update dashboard feed
        if: always()
        run: |
          git config user.name "alnassr-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: publish news"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
