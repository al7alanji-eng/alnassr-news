name: جمع الأخبار

on:
  schedule:
    - cron: "*/15 * * * *"   # كل 15 دقيقة (GitHub قد يتأخر بضع دقائق)
  workflow_dispatch: {}       # تشغيل يدوي من تبويب Actions

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # latest state, not the commit that triggered the run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and queue news
        run: python -m bot.collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - name: Save state
        run: |
          git config user.name "alnassr-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: update news state"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin "$(git branch --show-current)" && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            exit 1
          fi
